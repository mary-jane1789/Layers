<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --mist:#E7E8E3;--mist-2:#DEE0DA;--surface:#F7F7F4;
    --ink:#232A2E;--ink-2:#5A6169;--ink-3:#8A9098;--line:#D2D4CE;
    --cold:#5B7A99;--cool:#8FA9B8;--mild:#A9A594;--warm:#C89B6E;--hot:#C77E52;
    --right:#5E8A6B;
    --shadow:0 1px 2px rgba(35,42,46,.06),0 8px 24px rgba(35,42,46,.07);
    --radius:18px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;background:var(--mist);color:var(--ink);
    font-family:"Instrument Sans",system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;overscroll-behavior-y:none}
  body{max-width:520px;margin:0 auto;min-height:100dvh;position:relative}
  .serif{font-family:"Instrument Serif",Georgia,serif}
  .mono{font-family:"JetBrains Mono",monospace}
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
  input,textarea{font-family:inherit}

  #app{padding:0 20px 120px}
  header.top{padding:26px 4px 14px;display:flex;align-items:baseline;justify-content:space-between}
  header.top .wordmark{font-size:27px;line-height:1;letter-spacing:.3px}
  header.top .date{font-size:12px;color:var(--ink-2);letter-spacing:.4px}
  .eyebrow{font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--ink-3);
    font-weight:600;margin:0 0 10px}

  .card{background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow);
    padding:20px;margin-bottom:16px;border:1px solid rgba(210,212,206,.5)}

  .photo-drop{position:relative;aspect-ratio:4/5;border-radius:14px;overflow:hidden;
    background:var(--mist-2);border:1.5px dashed var(--line);display:flex;
    align-items:center;justify-content:center;text-align:center;color:var(--ink-3)}
  .photo-drop.filled{border-style:solid;border-color:transparent}
  .photo-drop img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  .photo-drop .hint{padding:24px;z-index:1}
  .photo-drop .hint .ico{width:34px;height:34px;margin:0 auto 10px;opacity:.55}
  .photo-drop .retake{position:absolute;bottom:10px;right:10px;background:rgba(35,42,46,.78);
    color:#fff;font-size:12px;padding:7px 12px;border-radius:20px;z-index:2;backdrop-filter:blur(4px)}
  input[type=file]{display:none}

  .gauge{display:flex;flex-direction:column;align-items:center;margin:4px 0 6px}
  .gauge .readout{font-size:64px;line-height:.9;letter-spacing:-1px;font-weight:500}
  .gauge .readout .unit{font-size:26px;color:var(--ink-3);margin-left:2px}
  .gauge .track{width:100%;margin-top:16px;height:34px;position:relative}
  .gauge input[type=range]{-webkit-appearance:none;width:100%;height:6px;border-radius:6px;
    background:linear-gradient(90deg,#5B7A99,#8FA9B8,#A9A594,#C89B6E,#C77E52);outline:none}
  .gauge input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:26px;height:26px;
    border-radius:50%;background:#fff;border:3px solid currentColor;box-shadow:0 2px 6px rgba(0,0,0,.18);cursor:grab}
  .gauge input[type=range]::-moz-range-thumb{width:26px;height:26px;border-radius:50%;
    background:#fff;border:3px solid currentColor;box-shadow:0 2px 6px rgba(0,0,0,.18)}
  .gauge .scale{display:flex;justify-content:space-between;width:100%;margin-top:2px;
    font-size:10px;color:var(--ink-3);letter-spacing:.5px}
  .gauge.humid input[type=range]{background:linear-gradient(90deg,#C9B89A,#9DB6AE,#3E7C8C)}

  .chips{display:flex;gap:8px;flex-wrap:wrap}
  .chip{border:1px solid var(--line);background:var(--surface);border-radius:12px;
    padding:11px 13px;font-size:13.5px;display:flex;align-items:center;gap:8px;
    color:var(--ink-2);transition:.15s;flex:1 1 auto;justify-content:center;min-width:0}
  .chip .wico{width:18px;height:18px;flex:none}
  .chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
  .chip.on .wico{color:#fff}

  .verdict{display:flex;gap:6px;margin-top:2px}
  .verdict button{flex:1;border-radius:11px;padding:12px 4px;font-size:11.5px;line-height:1.25;
    border:1px solid var(--line);background:var(--surface);color:var(--ink-2);transition:.15s}
  .verdict button .em{display:block;font-size:15px;margin-bottom:3px}
  .verdict button.on{color:#fff;border-color:transparent}

  label.field{display:block;font-size:12px;letter-spacing:.4px;color:var(--ink-2);
    text-transform:uppercase;font-weight:600;margin:2px 0 10px}
  textarea.note{width:100%;border:1px solid var(--line);border-radius:12px;padding:12px 14px;
    font-size:14px;color:var(--ink);background:var(--surface);resize:none;min-height:46px;line-height:1.4}
  textarea.note:focus{outline:none;border-color:var(--ink-3)}

  .save-btn{width:100%;background:var(--ink);color:#fff;border-radius:14px;padding:16px;
    font-size:15px;font-weight:600;letter-spacing:.3px;margin-top:4px;transition:.15s}
  .save-btn:active{transform:scale(.99)}
  .save-btn:disabled{opacity:.4}

  .filterbar{display:flex;gap:7px;overflow-x:auto;padding:2px 0 14px;margin:0 -4px;scrollbar-width:none}
  .filterbar::-webkit-scrollbar{display:none}
  .filterbar .chip{flex:0 0 auto}
  .band{margin-bottom:8px}
  .band-head{display:flex;align-items:center;gap:10px;padding:6px 2px}
  .band-head .temp{font-size:13px;font-weight:700;letter-spacing:.5px}
  .band-head .rule{flex:1;height:1px;background:var(--line)}
  .band-head .count{font-size:11px;color:var(--ink-3)}
  .thumbs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .thumb{position:relative;aspect-ratio:4/5;border-radius:12px;overflow:hidden;background:var(--mist-2);box-shadow:var(--shadow)}
  .thumb img{width:100%;height:100%;object-fit:cover}
  .thumb .tag{position:absolute;left:6px;bottom:6px;display:flex;align-items:center;gap:4px;
    background:rgba(247,247,244,.9);border-radius:8px;padding:3px 6px;font-size:10px;font-weight:600;backdrop-filter:blur(3px)}
  .thumb .tag .wico{width:11px;height:11px}
  .thumb .vdot{position:absolute;top:6px;right:6px;width:11px;height:11px;border-radius:50%;border:2px solid rgba(247,247,244,.95)}

  .advice{border-radius:14px;padding:18px;margin-top:16px;line-height:1.5;font-size:14.5px;border:1px solid var(--line);background:var(--surface)}
  .advice .lead{font-size:16px;margin-bottom:8px;display:flex;align-items:center;gap:9px}
  .advice .refs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
  .advice .thinking{color:var(--ink-3);font-size:13px;font-style:italic}
  .spinner{width:16px;height:16px;border:2px solid var(--line);border-top-color:var(--ink);
    border-radius:50%;display:inline-block;animation:spin .7s linear infinite;vertical-align:-2px}
  @keyframes spin{to{transform:rotate(360deg)}}

  .sheet-bg{position:fixed;inset:0;background:rgba(35,42,46,.42);z-index:40;opacity:0;
    pointer-events:none;transition:.2s;backdrop-filter:blur(2px)}
  .sheet-bg.open{opacity:1;pointer-events:auto}
  .sheet{position:fixed;left:0;right:0;bottom:0;max-width:520px;margin:0 auto;background:var(--mist);
    border-radius:24px 24px 0 0;z-index:41;transform:translateY(100%);transition:.28s cubic-bezier(.3,.7,.3,1);
    padding:10px 20px calc(28px + env(safe-area-inset-bottom));max-height:88dvh;overflow-y:auto}
  .sheet.open{transform:translateY(0)}

<script>
/* ============================================================
   Layers — your personal weather wardrobe.
   Runs fully on-device. Data lives in IndexedDB on this phone (no server, no Claude).
   ============================================================ */

const WEATHER = [
  {code:'sun',   label:'Sunny / bright'},
  {code:'cloud', label:'Cloudy / grey'},
  {code:'rain',  label:'Rain'},
  {code:'snow',  label:'Snow'},
  {code:'storm', label:'Storm / wind'},
];
const VERDICTS = [
  {v:2,  short:'Way too warm', em:'\u{1F525}'},
  {v:1,  short:'A bit warm',   em:'\u{1F642}'},
  {v:0,  short:'Just right',   em:'\u2713'},
  {v:-1, short:'A bit cool',   em:'\u{1F642}'},
  {v:-2, short:'Way too cold', em:'\u{1F976}'},
];
const BANDS = [
  {min:30, max:99, label:'over 30\u00B0'},
  {min:25, max:30, label:'25\u201330\u00B0'},
  {min:20, max:25, label:'20\u201325\u00B0'},
  {min:15, max:20, label:'15\u201320\u00B0'},
  {min:10, max:15, label:'10\u201315\u00B0'},
  {min:5,  max:10, label:'5\u201310\u00B0'},
  {min:0,  max:5,  label:'0\u20135\u00B0'},
  {min:-99,max:0,  label:'under 0\u00B0'},
];

function wIcon(code, cls='wico'){
  const s = {
    sun:'<circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2.4M12 19.1v2.4M4.4 4.4l1.7 1.7M17.9 17.9l1.7 1.7M2.5 12h2.4M19.1 12h2.4M4.4 19.6l1.7-1.7M17.9 6.1l1.7-1.7"/>',
    cloud:'<path d="M7 18h9.5a3.5 3.5 0 0 0 .3-6.98 5 5 0 0 0-9.64-1.2A3.9 3.9 0 0 0 7 18z"/>',
    rain:'<path d="M7 15h9.3a3.4 3.4 0 0 0 .3-6.8 4.8 4.8 0 0 0-9.3-1.15A3.75 3.75 0 0 0 7 15z"/><path d="M9 18l-.8 2M13 18l-.8 2M17 18l-.8 2"/>',
    snow:'<path d="M7 14h9.3a3.4 3.4 0 0 0 .3-6.8 4.8 4.8 0 0 0-9.3-1.15A3.75 3.75 0 0 0 7 14z"/><path d="M9 18h.01M13 18.5h.01M11 20.5h.01M16 18h.01"/>',
    storm:'<path d="M7 14h9.3a3.4 3.4 0 0 0 .3-6.8 4.8 4.8 0 0 0-9.3-1.15A3.75 3.75 0 0 0 7 14z"/><path d="M12 15l-2 3h3l-2 3.2"/>',
  }[code] || '';
  return `<svg class="${cls}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">${s}</svg>`;
}
function wLabel(code){ return (WEATHER.find(w=>w.code===code)||{}).label || code; }

function tempColor(t){
  const stops=[[-12,'#4E6E8C'],[4,'#8FA9B8'],[14,'#A9A594'],[24,'#C89B6E'],[36,'#BE6E42']];
  t=Math.max(-12,Math.min(36,t));
  for(let i=0;i<stops.length-1;i++){
    const [a,ca]=stops[i],[b,cb]=stops[i+1];
    if(t>=a&&t<=b){const f=(t-a)/(b-a);return mix(ca,cb,f);}
  }
  return stops[stops.length-1][1];
}
function mix(c1,c2,f){
  const p=h=>[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];
  const [r1,g1,b1]=p(c1),[r2,g2,b2]=p(c2);
  const r=Math.round(r1+(r2-r1)*f),g=Math.round(g1+(g2-g1)*f),b=Math.round(b1+(b2-b1)*f);
  return `rgb(${r},${g},${b})`;
}
function verdictColor(v){
  if(v===0) return 'var(--right)';
  if(v>0)  return v===2?'#C77E52':'#C89B6E';
  return v===-2?'#5B7A99':'#8FA9B8';
}
function humidColor(h){
  const stops=[[0,'#C6B79A'],[50,'#8FB0AE'],[100,'#3E7C8C']];
  h=Math.max(0,Math.min(100,h));
  for(let i=0;i<stops.length-1;i++){
    const [a,ca]=stops[i],[b,cb]=stops[i+1];
    if(h>=a&&h<=b){return mix(ca,cb,(h-a)/(b-a));}
  }
  return stops[stops.length-1][1];
}

/* ---------- On-device storage (IndexedDB) — no server, no Claude ---------- */
const DB_NAME='layers-db', STORE='kv';
const memFallback={}; let _useMem=false, _dbp=null;
function _db(){
  if(_dbp) return _dbp;
  _dbp=new Promise((res,rej)=>{
    if(!('indexedDB' in window)){ _useMem=true; return rej(); }
    const r=indexedDB.open(DB_NAME,1);
    r.onupgradeneeded=()=>{ if(!r.result.objectStoreNames.contains(STORE)) r.result.createObjectStore(STORE); };
    r.onsuccess=()=>res(r.result);
    r.onerror=()=>{ _useMem=true; rej(r.error); };
  });
  return _dbp;
}
function _store(mode){ return _db().then(d=>d.transaction(STORE,mode).objectStore(STORE)); }
async function stGet(k){
  if(_useMem) return memFallback[k] ?? null;
  try{ const s=await _store('readonly'); return await new Promise(res=>{ const r=s.get(k); r.onsuccess=()=>res(r.result??null); r.onerror=()=>res(null); }); }
  catch(e){ return memFallback[k] ?? null; }
}
async function stSet(k,v){
  memFallback[k]=v;
  if(_useMem) return true;
  try{ const s=await _store('readwrite'); return await new Promise(res=>{ const r=s.put(v,k); r.onsuccess=()=>res(true); r.onerror=()=>res(false); }); }
  catch(e){ return false; }
}
async function stDel(k){
  delete memFallback[k];
  if(_useMem) return true;
  try{ const s=await _store('readwrite'); return await new Promise(res=>{ const r=s.delete(k); r.onsuccess=()=>res(true); r.onerror=()=>res(false); }); }
  catch(e){ return false; }
}
async function stList(prefix){
  if(_useMem) return Object.keys(memFallback).filter(k=>k.startsWith(prefix));
  try{
    const s=await _store('readonly');
    return await new Promise(res=>{ const keys=[]; const r=s.openKeyCursor();
      r.onsuccess=()=>{ const c=r.result; if(c){ if(String(c.key).startsWith(prefix)) keys.push(c.key); c.continue(); } else res(keys); };
      r.onerror=()=>res([]); });
  }catch(e){ return Object.keys(memFallback).filter(k=>k.startsWith(prefix)); }
}

function compressImage(file){
  // Adaptive: shrink + lower quality until the stored photo fits a tiny budget.
  return new Promise((res,rej)=>{
    const img=new Image();
    img.onload=()=>{
      const BUDGET=55*1024;                 // target ~55 KB stored per photo
      const QUALS=[0.58,0.5,0.42,0.35,0.3];
      let maxd=760, best=null;
      for(let pass=0; pass<4; pass++){
        let w=img.width, h=img.height;
        if(w>h && w>maxd){h=Math.round(h*maxd/w);w=maxd;}
        else if(h>=w && h>maxd){w=Math.round(w*maxd/h);h=maxd;}
        const cv=document.createElement('canvas'); cv.width=w; cv.height=h;
        const ctx=cv.getContext('2d');
        ctx.fillStyle='#fff'; ctx.fillRect(0,0,w,h);   // flatten any transparency
        ctx.drawImage(img,0,0,w,h);
        for(const q of QUALS){
          const url=cv.toDataURL('image/jpeg',q);
          const bytes=Math.round(url.length*0.75);      // base64 -> bytes
          best={data:url,bytes};
          if(bytes<=BUDGET){ res(best); return; }
        }
        maxd=Math.round(maxd*0.8);            // still too big -> shrink and retry
      }
      res(best);                              // return the smallest achieved
    };
    img.onerror=rej;
    const fr=new FileReader(); fr.onload=e=>img.src=e.target.result; fr.onerror=rej; fr.readAsDataURL(file);
  });
}

let draft = {photo:null, temp:14, humid:60, weather:null, verdict:null, outfit:'', notes:''};
let entries = [];
let planState = {temp:8, humid:60, weather:null};
let archiveFilter = null;

document.addEventListener('DOMContentLoaded', init);
async function init(){
  document.getElementById('todayLabel').textContent =
    new Date().toLocaleDateString('en-GB',{weekday:'short',day:'2-digit',month:'short'});
  buildWeatherChips(); buildVerdictRow(); buildPlanWeatherChips(); buildArchiveFilter();
  wirePhoto(); wireGauges(); wireSave(); wirePlan(); wireNav(); wireSheet();
  await loadEntries();
  syncTempColor(draft.temp,'gauge','tempVal');
  syncTempColor(planState.temp,'planGauge','planTempVal');
  syncHumid(draft.humid,'humidGauge','humidVal');
  syncHumid(planState.humid,'planHumidGauge','planHumidVal');
}

function buildWeatherChips(){
  const el=document.getElementById('weatherChips');
  el.innerHTML=WEATHER.map(w=>`<button class="chip" data-w="${w.code}">${wIcon(w.code)}<span>${w.label}</span></button>`).join('');
  el.querySelectorAll('.chip').forEach(c=>c.addEventListener('click',()=>{
    draft.weather=c.dataset.w;
    el.querySelectorAll('.chip').forEach(x=>x.classList.toggle('on',x===c));
    refreshSave();
  }));
}
function buildVerdictRow(){
  const el=document.getElementById('verdictRow');
  el.innerHTML=VERDICTS.map(v=>`<button data-v="${v.v}"><span class="em">${v.em}</span>${v.short}</button>`).join('');
  el.querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>{
    draft.verdict=parseInt(b.dataset.v);
    el.querySelectorAll('button').forEach(x=>{
      const on=x===b;x.classList.toggle('on',on);
      x.style.background=on?verdictColor(parseInt(x.dataset.v)):'';
    });
    refreshSave();
  }));
}
function buildPlanWeatherChips(){
  const el=document.getElementById('planWeatherChips');
  el.innerHTML=WEATHER.map(w=>`<button class="chip" data-w="${w.code}">${wIcon(w.code)}<span>${w.label}</span></button>`).join('');
  el.querySelectorAll('.chip').forEach(c=>c.addEventListener('click',()=>{
    planState.weather=c.dataset.w;
    el.querySelectorAll('.chip').forEach(x=>x.classList.toggle('on',x===c));
  }));
}
function buildArchiveFilter(){
  const el=document.getElementById('archiveFilter');
  el.innerHTML=`<button class="chip on" data-w="">All</button>`+
    WEATHER.map(w=>`<button class="chip" data-w="${w.code}">${wIcon(w.code)}<span>${w.label}</span></button>`).join('');
  el.querySelectorAll('.chip').forEach(c=>c.addEventListener('click',()=>{
    archiveFilter=c.dataset.w||null;
    el.querySelectorAll('.chip').forEach(x=>x.classList.toggle('on',x===c));
    renderArchive();
  }));
}

function wirePhoto(){
  const drop=document.getElementById('photoDrop'); const input=document.getElementById('fileInput');
  const open=()=>input.click();
  drop.addEventListener('click',open);
  document.getElementById('retakeBtn').addEventListener('click',e=>{e.stopPropagation();open();});
  input.addEventListener('change',async e=>{
    const f=e.target.files[0]; if(!f) return;
    showToast('Processing photo\u2026');
    try{
      const {data,bytes}=await compressImage(f); draft.photo=data;
      let img=drop.querySelector('img'); if(!img){img=document.createElement('img');drop.appendChild(img);}
      img.src=data; drop.classList.add('filled');
      document.getElementById('photoHint').classList.add('hidden');
      document.getElementById('retakeBtn').classList.remove('hidden');
      refreshSave(); showToast('Photo ready \u00B7 ~'+Math.max(1,Math.round(bytes/1024))+' KB');
    }catch(err){ showToast("Couldn't load photo"); }
  });
}

function wireGauges(){
  const r=document.getElementById('tempRange');
  r.addEventListener('input',()=>{draft.temp=parseInt(r.value);syncTempColor(draft.temp,'gauge','tempVal');});
  const pr=document.getElementById('planTempRange');
  pr.addEventListener('input',()=>{planState.temp=parseInt(pr.value);syncTempColor(planState.temp,'planGauge','planTempVal');});
  const hr=document.getElementById('humidRange');
  hr.addEventListener('input',()=>{draft.humid=parseInt(hr.value);syncHumid(draft.humid,'humidGauge','humidVal');});
  const phr=document.getElementById('planHumidRange');
  phr.addEventListener('input',()=>{planState.humid=parseInt(phr.value);syncHumid(planState.humid,'planHumidGauge','planHumidVal');});
}
function syncTempColor(t,gaugeId,valId){
  document.getElementById(gaugeId).style.color=tempColor(t);
  const el=document.getElementById(valId); el.textContent=t; el.style.color='var(--ink)';
}
function syncHumid(h,gaugeId,valId){
  document.getElementById(gaugeId).style.color=humidColor(h);
  const el=document.getElementById(valId); el.textContent=h; el.style.color='var(--ink)';
}

function refreshSave(){
  document.getElementById('saveBtn').disabled=!(draft.photo && draft.weather!=null && draft.verdict!=null);
}
function wireSave(){
  document.getElementById('saveBtn').addEventListener('click',async()=>{
    draft.outfit=document.getElementById('outfitInput').value.trim();
    draft.notes=document.getElementById('notesInput').value.trim();
    const entry={
      id:'outfit:'+Date.now(), dateISO:new Date().toISOString(),
      photo:draft.photo, temp:draft.temp, humid:draft.humid, weather:draft.weather, verdict:draft.verdict,
      outfit:draft.outfit, notes:draft.notes
    };
    await stSet(entry.id, JSON.stringify(entry));
    entries.unshift(entry); resetDraft(); showToast('Saved \u2713'); renderArchive();
  });
}
function resetDraft(){
  draft={photo:null,temp:14,humid:60,weather:null,verdict:null,outfit:'',notes:''};
  const drop=document.getElementById('photoDrop'); const img=drop.querySelector('img'); if(img) img.remove();
  drop.classList.remove('filled');
  document.getElementById('photoHint').classList.remove('hidden');
  document.getElementById('retakeBtn').classList.add('hidden');
  document.getElementById('tempRange').value=14; syncTempColor(14,'gauge','tempVal');
  document.getElementById('humidRange').value=60; syncHumid(60,'humidGauge','humidVal');
  document.getElementById('outfitInput').value=''; document.getElementById('notesInput').value='';
  document.querySelectorAll('#weatherChips .chip').forEach(x=>x.classList.remove('on'));
  document.querySelectorAll('#verdictRow button').forEach(x=>{x.classList.remove('on');x.style.background='';});
  document.getElementById('saveBtn').disabled=true;
}

async function loadEntries(){
  const keys=await stList('outfit:'); const out=[];
  for(const k of keys){ const raw=await stGet(k); if(raw){ try{ out.push(JSON.parse(raw)); }catch(e){} } }
  out.sort((a,b)=> new Date(b.dateISO)-new Date(a.dateISO)); entries=out; renderArchive();
}

function renderArchive(){
  const body=document.getElementById('archiveBody');
  let list=entries; if(archiveFilter) list=list.filter(e=>e.weather===archiveFilter);
  if(list.length===0){
    body.innerHTML=`<div class="empty"><div class="big serif">Nothing here yet</div>
      Log your first outfit today \u2014 over time Layers learns what works for you.</div>`;
    return;
  }
  let html='';
  for(const band of BANDS){
    const inBand=list.filter(e=>e.temp>=band.min && e.temp<band.max).sort((a,b)=>new Date(b.dateISO)-new Date(a.dateISO));
    if(inBand.length===0) continue;
    const col=tempColor((Math.max(band.min,-12)+Math.min(band.max,36))/2);
    html+=`<div class="band"><div class="band-head">
        <span class="temp mono" style="color:${col}">${band.label}</span>
        <span class="rule"></span><span class="count">${inBand.length}</span>
      </div><div class="thumbs">${inBand.map(e=>thumb(e)).join('')}</div></div>`;
  }
  body.innerHTML=html;
  body.querySelectorAll('.thumb').forEach(t=>t.addEventListener('click',()=>openSheet(t.dataset.id)));
}
function thumb(e){
  return `<div class="thumb" data-id="${e.id}"><img src="${e.photo}" alt="">
    <span class="vdot" style="background:${verdictColor(e.verdict)}"></span>
    <span class="tag">${wIcon(e.weather)}<span class="mono">${e.temp}\u00B0</span></span></div>`;
}

function wireSheet(){ document.getElementById('sheetBg').addEventListener('click',closeSheet); }
let openId=null;
function openSheet(id){
  const e=entries.find(x=>x.id===id); if(!e) return; openId=id;
  document.getElementById('sheetImg').src=e.photo;
  const st=document.getElementById('sheetTemp'); st.textContent=e.temp+'\u00B0C'; st.style.color=tempColor(e.temp);
  document.getElementById('sheetWeather').innerHTML=wIcon(e.weather)+' '+wLabel(e.weather);
  const sh=document.getElementById('sheetHumid');
  if(e.humid!=null){ sh.textContent=e.humid+'%'; sh.style.color=humidColor(e.humid); }
  else { sh.textContent='\u2014'; sh.style.color='var(--ink-3)'; }
  const vd=VERDICTS.find(v=>v.v===e.verdict); const sv=document.getElementById('sheetVerdict');
  sv.textContent=vd?vd.short:''; sv.style.color=verdictColor(e.verdict);
  const outfit=e.outfit||e.note||'';
  document.getElementById('sheetOutfitWrap').style.display=outfit?'block':'none';
  document.getElementById('sheetOutfit').textContent=outfit;
  document.getElementById('sheetNotesWrap').style.display=e.notes?'block':'none';
  document.getElementById('sheetNotes').textContent=e.notes||'';
  document.getElementById('sheetDate').textContent=
    new Date(e.dateISO).toLocaleDateString('en-GB',{weekday:'long',day:'2-digit',month:'long',year:'numeric'});
  document.getElementById('sheetBg').classList.add('open'); document.getElementById('sheet').classList.add('open');
}
function closeSheet(){ document.getElementById('sheetBg').classList.remove('open'); document.getElementById('sheet').classList.remove('open'); openId=null; }
document.getElementById('deleteBtn').addEventListener('click',async()=>{
  if(!openId) return; await stDel(openId); entries=entries.filter(e=>e.id!==openId);
  closeSheet(); renderArchive(); showToast('Deleted');
});

function wirePlan(){ document.getElementById('planBtn').addEventListener('click',runPlan); }
async function runPlan(){
  if(planState.weather==null){ showToast('Pick the weather too'); return; }
  const box=document.getElementById('planResult'); const t=planState.temp, h=planState.humid, w=planState.weather;
  let near=entries.filter(e=>e.weather===w && Math.abs(e.temp-t)<=3); let widened=false;
  if(near.length===0){ near=entries.filter(e=>e.weather===w && Math.abs(e.temp-t)<=6); widened=true; }
  if(near.length===0){ near=entries.filter(e=>Math.abs(e.temp-t)<=3); widened=true; }
  // temperature leads; humidity nudges which references surface as most relevant
  near.sort((a,b)=> (Math.abs(a.temp-t)+Math.abs((a.humid??60)-h)/25) - (Math.abs(b.temp-t)+Math.abs((b.humid??60)-h)/25));
  const col=tempColor(t);
  if(near.length===0){
    box.innerHTML=`<div class="advice"><div class="lead"><span>No matching experience yet for ${t}\u00B0 in ${wLabel(w).toLowerCase()}.</span></div>
      Log a few days like this and I can advise you next time.</div>`;
    return;
  }
  const advice=buildAdvice(near,t,h,w);
  const refs=near.slice(0,3).map(e=>`<div class="thumb" data-id="${e.id}"><img src="${e.photo}" alt="">
      <span class="vdot" style="background:${verdictColor(e.verdict)}"></span>
      <span class="tag">${wIcon(e.weather)}<span class="mono">${e.temp}\u00B0</span></span></div>`).join('');
  box.innerHTML=`<div class="advice">
    <div class="lead"><span class="wico" style="color:${col};width:20px;height:20px">${wIcon(w,'wico')}</span>
      <span>For <b class="mono">${t}\u00B0</b> \u00B7 <b class="mono">${h}%</b> humidity in ${wLabel(w).toLowerCase()}${widened?' (similar days)':''}</span></div>
    <div>${advice}</div>
    <div class="refs">${refs}</div></div>`;
  box.querySelectorAll('.thumb').forEach(t=>t.addEventListener('click',()=>openSheet(t.dataset.id)));
}

function escapeHtml(s){ return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

function buildAdvice(near,t,h,w){
  const n=near.length;
  const avg=near.reduce((s,e)=>s+e.verdict,0)/n;
  const parts=[];
  if(avg>0.6) parts.push('At conditions like this you\u2019ve tended to <b>overdress</b> \u2014 try one layer less than your instinct.');
  else if(avg<-0.6) parts.push('At conditions like this you\u2019ve tended to run <b>cold</b> \u2014 add a layer or a warmer top.');
  else parts.push('You\u2019ve mostly judged this <b>about right</b> \u2014 repeat what worked.');
  // point to the closest outfit that actually felt right
  const rightOnes=near.filter(e=>e.verdict===0 && (e.outfit||e.note));
  const pool=(rightOnes.length?rightOnes:near.filter(e=>e.outfit||e.note));
  const pick=pool.slice().sort((a,b)=>Math.abs(a.temp-t)-Math.abs(b.temp-t))[0];
  if(pick){
    const felt=VERDICTS.find(v=>v.v===pick.verdict);
    parts.push(`Closest reference: <b>${escapeHtml(pick.outfit||pick.note)}</b> at ${pick.temp}\u00B0 \u2014 felt ${felt?felt.short.toLowerCase():'noted'}.`);
  }
  if(h>=75) parts.push('It\u2019s muggy \u2014 lean to breathable layers you can shed.');
  else if(h<=30) parts.push('Air is dry \u2014 it can feel a touch cooler than the number suggests.');
  if(n===1) parts.push('<span style="color:var(--ink-3)">(Based on a single past day \u2014 it sharpens as you log more.)</span>');
  return parts.join(' ');
}

function wireNav(){
  document.querySelectorAll('nav.tabbar button').forEach(b=>b.addEventListener('click',()=>{
    const v=b.dataset.view;
    ['add','archive','plan'].forEach(name=>{
      document.getElementById('view-'+name).classList.toggle('hidden',name!==v);
      document.getElementById('tab-'+name).classList.toggle('on',name===v);
    });
    window.scrollTo(0,0);
  }));
}

let toastTimer=null;
function showToast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.classList.remove('show'),1900); }
function hideToast(){ document.getElementById('toast').classList.remove('show'); }
</script>
